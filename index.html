<script>
  const SUPABASE_URL = "https://wacpvhatgnttejkysgqd.supabase.co";
  const SUPABASE_KEY = "sb_publishable_ik3CjSFxytZPpLVT1VCAYA_c2idSRTg";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  
  let allDesigns=[],allCategories=[],currentDesignId=null,currentCategoryFilter='all',editingId=null,editingType='';
  const frame=document.getElementById('photopea-frame'),globalLoader=document.getElementById('global-loader'),globalLoaderText=document.getElementById('global-loader-text');
  let isPhotopeaReady=false,pendingGeneration=null,generationTimeout=null;
  let bulkDesignId=null,isBulkGenerating=false,bulkQueue=[],bulkCurrentIndex=0,bulkZip=null,bulkZipFolderName="";
  
  let cachedBuffer = null, cachedDesignId = null, loadedDocumentId = null, isPreloading = false;
  
  let currentUser = null;
  let currentUserRole = null;
  let isAdminView = false; 

  async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (session) {
          currentUser = session.user;
          try {
              const { data, error } = await supabaseClient
                  .from('user_roles')
                  .select('role')
                  .eq('id', currentUser.id)
                  .single();
                  
              if (error) {
                  console.error("Auth Role Error Details:", error);
                  currentUserRole = 'editor';
              } else if (data) {
                  currentUserRole = data.role;
              } else {
                  currentUserRole = 'editor';
              }
          } catch(e) { 
              console.error("Auth Role Exception:", e); 
              currentUserRole = 'editor'; 
          }
      } else {
          currentUser = null;
          currentUserRole = null;
      }
      
      updateMenuUI();
  }

  function updateMenuUI() {
      if (currentUser) {
          document.getElementById('login-menu-item').style.display = 'none';
          document.getElementById('admin-menu-item').style.display = 'block';
          document.getElementById('logout-menu-item').style.display = 'block';
      } else {
          document.getElementById('login-menu-item').style.display = 'block';
          document.getElementById('admin-menu-item').style.display = 'none';
          document.getElementById('logout-menu-item').style.display = 'none';
          if (isAdminView) toggleView(); 
      }
  }

  function openLoginModal() { document.getElementById('login-email').value = ''; document.getElementById('login-password').value = ''; document.getElementById('loginModal').classList.add('active'); }
  function closeLoginModal() { document.getElementById('loginModal').classList.remove('active'); }

  async function loginUser() {
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value.trim();
      if(!email || !pass) return showAlert("Error", "Dono khane pur karein.", "⚠️");
      
      const btn = document.getElementById('loginBtn');
      btn.innerHTML = 'Wait...'; btn.disabled = true;

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email: email, password: pass });
      
      btn.innerHTML = 'Login'; btn.disabled = false;

      if (error) {
          return showAlert("Login Failed", "Email ya password ghalat hai.", "❌");
      }
      
      closeLoginModal();
      showToastMessage("Welcome to Admin! ✅");
      
      await checkAuth(); 
      
      if(!isAdminView) toggleView();
  }

  async function logoutUser() {
      await supabaseClient.auth.signOut();
      showToastMessage("Logged Out 👋");
      await checkAuth();
  }

  window.addEventListener('DOMContentLoaded', async () => {
      frame.src="https://www.photopea.com#%7B%7D";
      try {
          const savedTheme=localStorage.getItem('theme'),menuItem=document.getElementById('theme-menu-item');
          if(savedTheme==='light'){document.getElementById('app-wrapper').classList.add('light-theme');document.body.classList.add('light-theme');menuItem.innerHTML='🌙 Switch to Dark Theme'}
          else{document.getElementById('app-wrapper').classList.remove('light-theme');document.body.classList.remove('light-theme');menuItem.innerHTML='☀️ Switch to Light Theme'}
      }catch(e){}
      
      await checkAuth();
      loadAllData();
  });

  async function preloadPSD(designId) {
      if (loadedDocumentId === designId) return;
      while(isPreloading) { await new Promise(r => setTimeout(r, 100)); } 
      if (loadedDocumentId === designId) return;
      
      isPreloading = true;
      try {
          const design = allDesigns.find(d => d.id === designId);
          if(!design) { isPreloading = false; return; }
          
          let arrayBuffer;
          if (cachedDesignId === design.id && cachedBuffer) {
              arrayBuffer = cachedBuffer;
          } else {
              const response = await fetch(design.psdUrl);
              arrayBuffer = await response.arrayBuffer();
              cachedBuffer = arrayBuffer;
              cachedDesignId = design.id;
          }
          
          while(!isPhotopeaReady) { await new Promise(r => setTimeout(r, 500)); } 
          
          if (currentDesignId !== designId && bulkDesignId !== designId) {
              isPreloading = false; return; 
          }
          
          closePhotopeaDocument(); 
          frame.contentWindow.postMessage(arrayBuffer, "*");
          loadedDocumentId = design.id;
      } catch(e) {
          console.error("Preload error", e);
      }
      isPreloading = false;
  }

  function closePhotopeaDocument() {
      frame.contentWindow.postMessage('try{ while(app.documents.length>0){app.activeDocument.close()} }catch(e){}', '*');
      loadedDocumentId = null;
  }

  function showAlert(title,msg,icon="✅"){document.getElementById('alertTitle').innerText=title;document.getElementById('alertMsg').innerText=msg;document.getElementById('alertIcon').innerText=icon;document.getElementById('customAlertModal').classList.add('active')}
  function closeCustomAlert(){document.getElementById('customAlertModal').classList.remove('active')}
  function showConfirm(title,msg){return new Promise(resolve=>{document.getElementById('confirmTitle').innerText=title;document.getElementById('confirmMsg').innerText=msg;document.getElementById('customConfirmModal').classList.add('active');document.getElementById('confirmBtnYes').onclick=()=>{document.getElementById('customConfirmModal').classList.remove('active');resolve(true)};document.getElementById('confirmBtnNo').onclick=()=>{document.getElementById('customConfirmModal').classList.remove('active');resolve(false)}})}
  function toggleTheme(){const wrapper=document.getElementById('app-wrapper'),body=document.body,menuItem=document.getElementById('theme-menu-item');wrapper.classList.toggle('light-theme');body.classList.toggle('light-theme');if(wrapper.classList.contains('light-theme')){menuItem.innerHTML='🌙 Switch to Dark Theme';localStorage.setItem('theme','light')}else{menuItem.innerHTML='☀️ Switch to Light Theme';localStorage.setItem('theme','dark')}}
  
  function showToastMessage(msg) {
      const toast = document.getElementById('toast-container');
      toast.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span>${msg}</span>
      `;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 2500);
  }

  function copyDesignLink(event, designId) {
      event.stopPropagation();
      const shareUrl = `${window.location.origin}/?design=${designId}`;
      navigator.clipboard.writeText(shareUrl).then(() => {
          showToastMessage("Link Copied!");
      }).catch(err => {
          console.error("Copy failed:", err);
          showAlert("Error", "Could not copy link", "❌");
      });
  }

  window.addEventListener("message", async e => {
      if(e.data==="done"){
          isPhotopeaReady=true;
          if(pendingGeneration){pendingGeneration();pendingGeneration=null}
          return
      }
      if(typeof e.data==='string' && e.data.startsWith("STATUS:")) return;
      
      if(typeof e.data==='string' && e.data.startsWith("ERROR:")){
          clearTimeout(generationTimeout);
          hidePhotopea();
          if(isBulkGenerating){showAlert("Bulk Error",e.data.replace("ERROR: ",""),"❌");isBulkGenerating=false}
          else{showAlert("Error",e.data.replace("ERROR: ",""),"❌");if(currentDesignId)resetUI(currentDesignId)}
          return
      }

      if (e.data === "NOT_LOADED") {
          if (window.handleNotLoaded) window.handleNotLoaded();
          return;
      }
      if (e.data === "TEXT_APPLIED") {
          if (window.handleTextApplied) window.handleTextApplied();
          return;
      }
      
      if(e.data instanceof ArrayBuffer || e.data instanceof Blob){
          clearTimeout(generationTimeout);
          
          if(isBulkGenerating){
              const blob=e.data instanceof Blob?e.data:new Blob([e.data],{type:"image/jpeg"});
              bulkZip.file(`${bulkQueue[bulkCurrentIndex]}_${bulkZipFolderName}.jpg`,blob);
              
              const design=allDesigns.find(d=>d.id===bulkDesignId);
              if(design){
                  design.downloads = (design.downloads || 0) + 1;
                  await supabaseClient.from('designs').update({downloads: design.downloads}).eq('id',bulkDesignId);
              }
              
              bulkCurrentIndex++;
              processNextBulkName(design);
          } else {
              if(currentDesignId){
                  const design=allDesigns.find(d=>d.id===currentDesignId);
                  if(design){
                      design.downloads = (design.downloads || 0) + 1;
                      await supabaseClient.from('designs').update({downloads: design.downloads}).eq('id',currentDesignId);
                  }
                  renderStats()
              }
              const blob=e.data instanceof Blob?e.data:new Blob([e.data],{type:"image/jpeg"});
              const url=URL.createObjectURL(blob);
              const a=document.createElement("a");
              a.href=url;
              
              const inputEl = document.getElementById(`input-${currentDesignId}`);
              const nameForFile = inputEl ? inputEl.value.trim() : 'art';
              a.download = (nameForFile || 'art') + "_Musaafir.jpg";
              a.click();
              
              if(inputEl) inputEl.value = ""; 
              hidePhotopea();
              
              if(currentDesignId){
                  const imgEl = document.querySelector(`#card-${currentDesignId} .img-container img`);
                  if(imgEl) imgEl.src = url;
                  resetUI(currentDesignId);
              }
          }
      }
  });
  
  function showPhotopea(){globalLoader.classList.add('active')}
  function hidePhotopea(){globalLoader.classList.remove('active')}
  
  // ---> DATA LOAD ERROR DEBUG & FIX <---
  async function loadAllData(){
      try {
          // Categories Load
          const{data:catData,error:catErr}=await supabaseClient.from('categories').select('*').order('order');
          if(catErr) {
              console.error("Categories Fetch Error:", catErr);
              showAlert("Category Error", catErr.message, "⚠️");
          }
          allCategories=catData||[];
          
          // Designs Load
          const{data:desData,error:desErr}=await supabaseClient.from('designs').select('*').order('order');
          if(desErr) {
              console.error("Designs Fetch Error:", desErr);
              showAlert("Designs Error", desErr.message, "⚠️");
          }
          allDesigns=(desData||[]).map(d=>({id:d.id,name:d.name,categoryId:d.category_id,psdUrl:d.psd_url,previewUrl:d.preview_url,status:d.status,order:d.order,downloads:d.downloads}));
          
          // Settings Load (Failing Gracefully)
          await loadSettings();
          
          const urlParams = new URLSearchParams(window.location.search);
          const sharedDesignId = urlParams.get('design');
          if(sharedDesignId && allDesigns.some(d => d.id === sharedDesignId && d.status !== 'draft')) {
              currentDesignId = sharedDesignId;
              currentCategoryFilter = 'all';
              
              setTimeout(() => {
                  const targetCard = document.getElementById('card-' + sharedDesignId);
                  if (targetCard) {
                      targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                      preloadPSD(sharedDesignId);
                  }
              }, 500);
          }
          
          if(isAdminView) renderAdmin(); 
          renderUser();
          renderStats();
      } catch(err){
          console.error("Main Data Load Exception:", err);
          showAlert("Data Load Issue", "Check console for details.", "❌");
      }
  }
  
  function renderStats(){const totalGenerates=allDesigns.reduce((sum,d)=>sum+(d.downloads||0),0);document.getElementById('admin-stats-content').innerHTML=`<div style="display:flex;flex-direction:column;gap:15px;margin-top:15px;"><div style="background:rgba(139,92,246,.1);padding:15px;border-radius:10px;display:flex;justify-content:space-between;"><span style="color:var(--text-muted);">Total Designs</span><h2 style="margin:0;color:var(--text-main);">${allDesigns.length}</h2></div><div style="background:rgba(59,130,246,.1);padding:15px;border-radius:10px;display:flex;justify-content:space-between;"><span style="color:var(--text-muted);">Total Categories</span><h2 style="margin:0;color:var(--text-main);">${allCategories.length}</h2></div><div style="background:rgba(34,197,94,.1);padding:15px;border-radius:10px;display:flex;justify-content:space-between;"><span style="color:var(--text-muted);">Total Generates</span><h2 style="margin:0;color:var(--text-main);">${totalGenerates}</h2></div></div>`}
  
  async function loadSettings(){
      try{
          const{data,error}=await supabaseClient.from('settings').select('*');
          if(error) {
              console.error("Settings Fetch Error:", error);
              return; // Fail gracefully
          }
          if(data && data.length > 0) {
              document.getElementById('contact-fb').href=data.find(s=>s.key==='fb')?.value||"#";
              document.getElementById('contact-wa').href=`https://wa.me/${data.find(s=>s.key==='wa')?.value||""}`;
              document.getElementById('contact-email').href=`mailto:${data.find(s=>s.key==='email')?.value||""}`;
              document.getElementById('setting-fb').value=data.find(s=>s.key==='fb')?.value||"";
              document.getElementById('setting-wa').value=data.find(s=>s.key==='wa')?.value||"";
              document.getElementById('setting-email').value=data.find(s=>s.key==='email')?.value||"";
          }
      }catch(e){
          console.error("Settings Exception:", e);
      }
  }
  
  function renderAdmin(){
      if (currentUserRole !== 'super_admin') {
          document.getElementById('tab-categories').style.display = 'none';
          document.getElementById('tab-settings').style.display = 'none';
          document.getElementById('tab-stats').style.display = 'none';
      } else {
          document.getElementById('tab-categories').style.display = 'block';
          document.getElementById('tab-settings').style.display = 'block';
          document.getElementById('tab-stats').style.display = 'block';
      }

      document.getElementById('cat-list').innerHTML=allCategories.map(c=>`<div class="admin-item"><div class="admin-item-info"><h4>${c.name}</h4></div><div class="admin-actions"><button class="btn action-btn" onclick="moveItem('categories','${c.id}','up')">⬅️ Left</button><button class="btn action-btn" onclick="moveItem('categories','${c.id}','down')">➡️ Right</button><button class="btn action-btn" onclick="openEditModal('category','${c.id}')">✏️ Edit</button><button class="btn danger action-btn" onclick="deleteCategory('${c.id}')">Delete</button></div></div>`).join('')||'<p>No categories.</p>';
      const catOptions=allCategories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
      document.getElementById('admin-category').innerHTML=catOptions;
      document.getElementById('edit-category').innerHTML=catOptions;
      
      document.getElementById('admin-list').innerHTML=allDesigns.map(d=>{
          const cat=allCategories.find(c=>c.id===d.categoryId),isPublished=d.status!=='draft';
          
          let actionButtons = '';
          
          if (currentUserRole === 'super_admin') {
              actionButtons = `
                  <button class="btn action-btn" onclick="moveItem('designs','${d.id}','up')">⬆️</button>
                  <button class="btn action-btn" onclick="moveItem('designs','${d.id}','down')">⬇️</button>
                  <button class="btn action-btn" onclick="openBulkModal('${d.id}')" style="background:rgba(139,92,246,.2);color:#a78bfa;">📦 Bulk</button>
                  <button class="btn action-btn" onclick="copyDesignLink(event, '${d.id}')" title="Copy Share Link">🔗</button>
                  <button class="btn action-btn" onclick="togglePublish('${d.id}')">${isPublished?'👁️ Hide':'👁️ Show'}</button>
                  <button class="btn action-btn" onclick="openEditModal('design','${d.id}')">✏️ Edit</button>
                  <button class="btn danger action-btn" onclick="deleteDesign('${d.id}')">Delete</button>
              `;
          } else {
              actionButtons = `
                  <button class="btn action-btn" onclick="openBulkModal('${d.id}')" style="background:rgba(139,92,246,.2);color:#a78bfa;">📦 Bulk Generate</button>
                  <button class="btn action-btn" onclick="copyDesignLink(event, '${d.id}')" title="Copy Share Link">🔗 Share Link</button>
              `;
          }

          return `<div class="admin-item">
              <img src="${d.previewUrl}">
              <div class="admin-item-info">
                  <h4>${d.name} <span class="status-badge ${isPublished?'status-published':'status-draft'}">${isPublished?'PUBLISHED':'DRAFT'}</span></h4>
                  <span>Cat: ${cat?cat.name:'Unknown'} | Downloads: <b>${d.downloads||0}</b></span>
              </div>
              <div class="admin-actions">
                  ${actionButtons}
              </div>
          </div>`
      }).join('')||'<p>No designs.</p>'
  }
  
  function renderUser(){
      document.getElementById('category-bar').innerHTML=`<div class="cat-tab ${currentCategoryFilter==='all'?'active':''}" onclick="filterCategory('all')">All</div>`+allCategories.map(cat=>`<div class="cat-tab ${currentCategoryFilter===cat.id?'active':''}" onclick="filterCategory('${cat.id}')">${cat.name}</div>`).join('');
      let filtered=allDesigns.filter(d=>d.status!=='draft');
      if(currentCategoryFilter!=='all')filtered=filtered.filter(d=>d.categoryId===currentCategoryFilter);
      const grid=document.getElementById('design-grid');
      if(filtered.length===0){grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:60px 20px;"><h3>No designs found</h3></div>`;return}
      
      grid.innerHTML=filtered.map(d=>`
          <div class="design-card ${d.id===currentDesignId?'active':''}" id="card-${d.id}">
              <div class="img-container" onclick="toggleCard('${d.id}')">
                  <img src="${d.previewUrl}">
                  <button class="user-copy-btn" onclick="copyDesignLink(event, '${d.id}')">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                      </svg> Copy
                  </button>
              </div>
              <div class="action-area">
                  <input type="text" id="input-${d.id}" placeholder="Your Name">
                  <button class="btn primary" id="btn-${d.id}" style="width:100%;padding:14px;font-size:16px" onclick="generateImage('${d.id}')">✨ Generate & Download</button>
              </div>
          </div>`).join('')
  }
  
  function filterCategory(catId){
      currentCategoryFilter=catId;
      currentDesignId=null; 
      closePhotopeaDocument(); 
      renderUser();
  }
  
  function toggleCard(id){
      if(currentDesignId === id) {
          currentDesignId = null;
          closePhotopeaDocument();
      } else {
          if(currentDesignId !== null) closePhotopeaDocument();
          currentDesignId = id;
          preloadPSD(id);
      }
      renderUser();
  }
  
  async function moveItem(store,id,dir){let items=store==='designs'?[...allDesigns]:[...allCategories],idx=items.findIndex(i=>i.id===id);if(idx===-1)return;if(dir==='up'&&idx>0){let t=items[idx];items[idx]=items[idx-1];items[idx-1]=t}else if(dir==='down'&&idx<items.length-1){let t=items[idx];items[idx]=items[idx+1];items[idx+1]=t}else return;for(let i=0;i<items.length;i++){items[i].order=i+1;await supabaseClient.from(store).update({order:items[i].order}).eq('id',items[i].id)}loadAllData()}
  async function togglePublish(id){const d=allDesigns.find(x=>x.id===id);await supabaseClient.from('designs').update({status:d.status==='draft'?'published':'draft'}).eq('id',id);loadAllData()}
  async function saveCategoryAdmin(){const n=document.getElementById('cat-name').value.trim();if(!n)return;const o=allCategories.length>0?Math.max(...allCategories.map(c=>c.order||0))+1:1;await supabaseClient.from('categories').insert([{id:'cat_'+Date.now(),name:n,order:o}]);document.getElementById('cat-name').value='';showAlert("Success","Added","✅");loadAllData()}
  async function deleteCategory(id){if(!await showConfirm("Delete","Sure?"))return;await supabaseClient.from('designs').delete().eq('category_id',id);await supabaseClient.from('categories').delete().eq('id',id);loadAllData()}
  function openEditModal(type,id){editingType=type;editingId=id;document.getElementById('editModal').classList.add('active');if(type==='design'){const d=allDesigns.find(x=>x.id===id);document.getElementById('editModalTitle').innerText="Edit Design";document.getElementById('edit-name').value=d.name;document.getElementById('edit-category').value=d.categoryId;document.getElementById('edit-category-row').style.display='flex'}else{const c=allCategories.find(x=>x.id===id);document.getElementById('editModalTitle').innerText="Edit Category";document.getElementById('edit-name').value=c.name;document.getElementById('edit-category-row').style.display='none'}}
  function closeEditModal(){document.getElementById('editModal').classList.remove('active')}
  async function saveEdit(){const n=document.getElementById('edit-name').value.trim();if(!n)return;if(editingType==='design'){await supabaseClient.from('designs').update({name:n,category_id:document.getElementById('edit-category').value}).eq('id',editingId)}else{await supabaseClient.from('categories').update({name:n}).eq('id',editingId)}closeEditModal();loadAllData()}
  
  async function saveDesignAdmin(){
      const n=document.getElementById('admin-name').value.trim(),c=document.getElementById('admin-category').value,p=document.getElementById('admin-file').files[0],pr=document.getElementById('admin-preview').files[0];
      if(!n||!p||!pr)return showAlert("Missing","Fill all.","⚠️");
      const btn=document.querySelector('button[onclick="saveDesignAdmin()"]'),txt=btn.innerHTML;
      btn.innerHTML='<span class="btn-spinner"></span> Uploading...';btn.disabled=true;
      const fdP=new FormData();fdP.append('file',p);fdP.append('upload_preset',"test_preset");
      const fdPr=new FormData();fdPr.append('file',pr);fdPr.append('upload_preset',"test_preset");
      try{
          const[resP,resPr]=await Promise.all([fetch(`https://api.cloudinary.com/v1_1/fujerk60/auto/upload`,{method:'POST',body:fdP}),fetch(`https://api.cloudinary.com/v1_1/fujerk60/auto/upload`,{method:'POST',body:fdPr})]);
          const dP=await resP.json(),dPr=await resPr.json();
          if(!dP.secure_url||!dPr.secure_url)throw new Error("Upload failed.");
          
          const minO = allDesigns.length > 0 ? Math.min(...allDesigns.map(d => d.order || 0)) - 1 : 1;
          
          await supabaseClient.from('designs').insert([{id:'d_'+Date.now(),name:n,category_id:c,psd_url:dP.secure_url,preview_url:dPr.secure_url,status:'published',order:minO,downloads:0}]);
          document.getElementById('admin-name').value='';document.getElementById('admin-file').value='';document.getElementById('admin-preview').value='';
          btn.innerHTML=txt;btn.disabled=false;
          showAlert("Success!","Design Published!","🎉");
          loadAllData()
      }catch(err){
          showAlert("Failed",err.message,"❌");
          btn.innerHTML=txt;btn.disabled=false
      }
  }
  
  async function deleteDesign(id){if(!await showConfirm("Delete","Sure?"))return;await supabaseClient.from('designs').delete().eq('id',id);if(currentDesignId===id)currentDesignId=null;loadAllData()}
  async function saveSettingsAdmin(){await supabaseClient.from('settings').upsert([{key:"fb",value:document.getElementById('setting-fb').value},{key:"wa",value:document.getElementById('setting-wa').value},{key:'email',value:document.getElementById('setting-email').value}]);showAlert("Saved","Links updated.","✅");loadSettings()}
  
  async function generateImage(cardId){
      const design=allDesigns.find(d=>d.id===cardId);
      const text=document.getElementById(`input-${cardId}`).value.trim();
      if(!text)return showAlert("Name Required","Enter name.","✍️");
      
      const btn=document.getElementById(`btn-${cardId}`);
      btn.disabled=true;
      btn.innerHTML='<span class="btn-spinner"></span> Generating...';
      globalLoaderText.innerText="Processing...";
      showPhotopea();
      
      clearTimeout(generationTimeout);
      generationTimeout=setTimeout(()=>{
          hidePhotopea();
          showAlert("Timeout","Took too long. Try again.","⏳");
          resetUI(cardId)
      },150000);
      
      const processPSD=async()=>{
          try{
              await preloadPSD(design.id);
              
              const safeText=text.replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,'\\n').replace(/\r/g,'');
              const changeTextScript=`
                  try {
                      if (app.documents.length > 0) {
                          var doc = app.activeDocument;
                          var newText = "${safeText}";
                          var found = false;
                          function findLayer(layers){
                              for(var i=0;i<layers.length;i++){
                                  var l=layers[i];
                                  try {
                                      if(l.typename==="LayerSet"){ findLayer(l.layers) }
                                      else if(l.kind===LayerKind.TEXT){
                                          if(l.name && l.name.toUpperCase()==="NAME"){
                                              l.textItem.contents=newText;
                                              found=true;
                                              break;
                                          }
                                      }
                                  } catch(e){}
                              }
                          }
                          findLayer(doc.layers);
                          if(found) { app.echoToOE("TEXT_APPLIED"); } 
                          else { app.echoToOE("ERROR: 'NAME' layer not found in template."); }
                      } else {
                          app.echoToOE("NOT_LOADED");
                      }
                  } catch(e) { app.echoToOE("ERROR: " + e.message); }
              `;
              
              const saveImageScript = `try { app.activeDocument.saveToOE("jpg"); } catch(e) { app.echoToOE("ERROR: " + e.message); }`;

              let retryCount = 0;
              window.handleNotLoaded = () => {
                  retryCount++;
                  if (retryCount > 40) {
                      hidePhotopea();
                      showAlert("Error", "Timeout loading PSD.", "❌");
                      resetUI(cardId);
                      window.handleNotLoaded = null;
                      window.handleTextApplied = null;
                      return;
                  }
                  setTimeout(() => frame.contentWindow.postMessage(changeTextScript, "*"), 500);
              };

              window.handleTextApplied = () => {
                  window.handleNotLoaded = null;
                  window.handleTextApplied = null;
                  if (currentDesignId !== cardId) return; 
                  setTimeout(() => {
                      if (currentDesignId === cardId) frame.contentWindow.postMessage(saveImageScript, "*");
                  }, 300);
              };

              frame.contentWindow.postMessage(changeTextScript, "*"); 
              
          }catch(err){
              hidePhotopea();
              showAlert("Error","Could not process file.","❌");
              resetUI(cardId)
          }
      };
      
      if(isPhotopeaReady)processPSD();
      else{
          pendingGeneration=processPSD;
          setTimeout(()=>{
              if(!isPhotopeaReady){
                  isPhotopeaReady=true;
                  if(pendingGeneration) { pendingGeneration(); pendingGeneration=null; }
              }
          },8000)
      }
  }
  
  function resetUI(cardId){
      const b=document.getElementById(`btn-${cardId}`);
      if(b){
          b.disabled=false;
          b.innerHTML='✨ Generate & Download'
      }
  }
  
  function openBulkModal(id){
      bulkDesignId=id;
      document.getElementById('bulkNamesInput').value='';
      document.getElementById('bulkNamesInput').disabled=false;
      document.getElementById('bulkStartBtn').style.display='block';
      document.getElementById('bulkCancelBtn').innerText='Cancel';
      document.getElementById('bulkProgressContainer').style.display='none';
      document.getElementById('bulkGenerateModal').classList.add('active');
      preloadPSD(id);
  }
  
  function closeBulkModal(){
      if(isBulkGenerating){
          showConfirm("Stop?","Stop?").then(res=>{
              if(res){
                  isBulkGenerating=false;
                  hidePhotopea();
                  closePhotopeaDocument(); 
                  document.getElementById('bulkGenerateModal').classList.remove('active')
              }
          })
      }else{
          closePhotopeaDocument(); 
          document.getElementById('bulkGenerateModal').classList.remove('active')
      }
  }
  
  async function startBulkGeneration(){
      const names=document.getElementById('bulkNamesInput').value.split('\n').map(n=>n.trim()).filter(n=>n!=='');
      if(names.length===0)return showAlert("Error","Enter names.","⚠️");
      if(names.length>20)return showAlert("Limit","Max 20.","⚠️");
      const design=allDesigns.find(d=>d.id===bulkDesignId);
      if(!design)return;
      
      isBulkGenerating=true;
      bulkQueue=names;
      bulkCurrentIndex=0;
      bulkZip=new JSZip();
      bulkZipFolderName=design.name.replace(/[^a-z0-9]/gi,'_')+"_Bulk";
      
      document.getElementById('bulkNamesInput').disabled=true;
      document.getElementById('bulkStartBtn').style.display='none';
      document.getElementById('bulkCancelBtn').innerText='Stop';
      document.getElementById('bulkProgressContainer').style.display='block';
      updateBulkProgress();
      showPhotopea();
      
      const loadAndStart = async () => {
          try {
              await preloadPSD(design.id);
              setTimeout(() => { processNextBulkName(design); }, 500);
          } catch(err) {
              hidePhotopea();
              showAlert("Error", "Could not load file.", "❌");
              isBulkGenerating = false;
          }
      };

      if (isPhotopeaReady) loadAndStart();
      else {
          pendingGeneration = loadAndStart;
          setTimeout(() => {
              if (!isPhotopeaReady) {
                  isPhotopeaReady = true;
                  if(pendingGeneration) { pendingGeneration(); pendingGeneration = null; }
              }
          }, 8000);
      }
  }
  
  function updateBulkProgress(){document.getElementById('bulkProgressText').innerText=`Processing ${bulkCurrentIndex+1} of ${bulkQueue.length}...`;document.getElementById('bulkProgressBar').style.width=((bulkCurrentIndex/bulkQueue.length)*100)+'%'}
  
  async function processNextBulkName(design){
      if(!isBulkGenerating||bulkCurrentIndex>=bulkQueue.length){
          if(isBulkGenerating)finishBulkGeneration();
          return
      }
      updateBulkProgress();
      const text=bulkQueue[bulkCurrentIndex];
      globalLoaderText.innerText=`Processing ${bulkCurrentIndex+1} of ${bulkQueue.length}...`;
      
      const processPSD=async()=>{
          const safeText=text.replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,'\\n').replace(/\r/g,'');
          
          const changeTextScript=`
              try {
                  if (app.documents.length > 0) {
                      var doc = app.activeDocument;
                      var newText = "${safeText}";
                      var found = false;
                      function findLayer(layers){
                          for(var i=0;i<layers.length;i++){
                              var l=layers[i];
                              try {
                                  if(l.typename==="LayerSet"){ findLayer(l.layers) }
                                  else if(l.kind===LayerKind.TEXT){
                                      if(l.name && l.name.toUpperCase()==="NAME"){
                                          l.textItem.contents=newText;
                                          found=true;
                                          break;
                                      }
                                  }
                              } catch(e){}
                          }
                      }
                      findLayer(doc.layers);
                      if(found) { app.echoToOE("TEXT_APPLIED"); } 
                      else { app.echoToOE("ERROR: 'NAME' layer not found in template."); }
                  } else {
                      app.echoToOE("NOT_LOADED");
                  }
              } catch(e) { app.echoToOE("ERROR: " + e.message); }
          `;
          
          const saveImageScript = `try { app.activeDocument.saveToOE("jpg"); } catch(e) { app.echoToOE("ERROR: " + e.message); }`;

          let retryCount = 0;
          window.handleNotLoaded = () => {
              retryCount++;
              if (retryCount > 40) {
                  hidePhotopea();
                  showAlert("Error", "Timeout loading PSD.", "❌");
                  isBulkGenerating = false;
                  window.handleNotLoaded = null;
                  window.handleTextApplied = null;
                  return;
              }
              setTimeout(() => frame.contentWindow.postMessage(changeTextScript, "*"), 500);
          };

          window.handleTextApplied = () => {
              window.handleNotLoaded = null;
              window.handleTextApplied = null;
              if (!isBulkGenerating) return; 
              setTimeout(() => {
                  if (isBulkGenerating) frame.contentWindow.postMessage(saveImageScript, "*");
              }, 300);
          };

          frame.contentWindow.postMessage(changeTextScript, "*");
      };
      
      if(isPhotopeaReady)processPSD();
      else { /* Handled by loadAndStart */ } 
  }
  
  async function finishBulkGeneration(){
      globalLoaderText.innerText="Processing complete...";
      document.getElementById('bulkProgressBar').style.width='100%';
      
      bulkZip.generateAsync({type:"blob"}).then(async content=>{
          const a=document.createElement("a");
          a.href=URL.createObjectURL(content);
          a.download=bulkZipFolderName+".zip";
          a.click();
          URL.revokeObjectURL(a.href);
          isBulkGenerating=false;
          hidePhotopea();
          closePhotopeaDocument(); 
          document.getElementById('bulkGenerateModal').classList.remove('active');
          loadAllData()
      })
  }

      isAdminView = !isAdminView;

      if(isAdminView){
          document.getElementById('admin-view').style.display='block';

      }

  function switchTab(tabName,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));if(el)el.classList.add('active');document.getElementById('panel-'+tabName).classList.add('active')}
